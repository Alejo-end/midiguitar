name: Compile firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/compile-sketches@v1
        with:
          # USB-OTG (TinyUSB) for USB-MIDI; CDC on boot so Serial stays off
          # UART0 (GPIO 43/44 are MIDI OUT and HOLD on the dongle).
          fqbn: esp32:esp32:XIAO_ESP32S3:USBMode=default,CDCOnBoot=cdc
          platforms: |
            - name: esp32:esp32
              source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          libraries: |
            - name: Adafruit NeoPixel
            - name: Adafruit SSD1306
            - name: Adafruit GFX Library
            - name: SparkFun VL53L1X 4m Laser Distance Sensor
            - name: SparkFun VL53L5CX Arduino Library
          # tof_midi_v4 is legacy (BLE, old pin map) and is not built.
          sketch-paths: |
            - code/tof_midi_v5
            - code/tof_midi_v6
            - code/tof_midi_v6_rx
            - code/debug
            - code/debug_oled
          enable-warnings-report: true
